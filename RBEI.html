<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RBEI - Loan Application Portal</title>
    
    <!-- 🟢 FIREBASE SDKs (COMPAT VERSION) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --rbei-navy: #1e293b;
            --rbei-blue: #3b82f6;
            --rbei-gray-bg: #f1f5f9;
            --rbei-card-bg: #ffffff;
            --rbei-border: #cbd5e1;
            --text-main: #334155;
            --text-light: #64748b;
            --success-green: #16a34a;
            --danger-red: #dc2626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--rbei-gray-bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background-color: var(--rbei-navy);
            color: white;
            padding: 15px 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .navbar-brand {
            font-weight: 800;
            font-size: 20px;
            letter-spacing: 0.5px;
        }

        .container {
            max-width: 700px;
            width: 90%;
            margin: 30px auto;
        }

        .card {
            background-color: var(--rbei-card-bg);
            border: 1px solid var(--rbei-border);
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        .card h2 {
            font-size: 22px;
            color: var(--rbei-navy);
            margin-bottom: 6px;
        }

        .card p {
            font-size: 13px;
            color: var(--text-light);
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        @media (max-width: 600px) {
            .form-group.full-width { grid-column: span 1; }
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--rbei-navy);
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--rbei-border);
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--rbei-blue);
        }

        .btn-submit {
            width: 100%;
            background-color: var(--rbei-blue);
            color: white;
            border: none;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
            transition: background-color 0.2s;
        }

        .btn-submit:hover { background-color: #2563eb; }
        .btn-submit:disabled { background-color: #94a3b8; cursor: not-allowed; }

        .alert-box {
            display: none;
            margin-top: 20px;
            padding: 12px 15px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="navbar-brand">RBEI Application Portal</div>
    <div style="font-size: 12px; opacity: 0.8;">Online Submission Portal</div>

    <div class="container">
    <div class="card">
        <h2>Borrower Application Form</h2>
        <p>Please fill out your complete information below to initiate underwriting review.</p>

        <form id="rbeiForm">
            <div class="form-grid">
                <div class="form-group full-width">
                    <label for="fullNameInput">Full Borrower Name</label>
                    <input type="text" id="fullNameInput" placeholder="e.g., Juan Dela Cruz" required>
                </div>

                <div class="form-group">
                    <label for="dobInput">Date of Birth</label>
                    <input type="text" id="dobInput" placeholder="MM/DD/YYYY" required>
                </div>

                <div class="form-group">
                    <label for="phoneInput">Contact Number</label>
                    <input type="text" id="phoneInput" placeholder="e.g., 0912 345 6789" required>
                </div>

                <div class="form-group full-width">
                    <label for="emailInput">Email Address</label>
                    <input type="email" id="emailInput" placeholder="e.g., borrower@email.com" required>
                </div>

                <div class="form-group full-width">
                    <label for="addressInput">Billing / Residential Address</label>
                    <input type="text" id="addressInput" placeholder="e.g., Street, City, Province" required>
                </div>

                <div class="form-group">
                    <label for="loanTypeInput">Loan Category</label>
                    <select id="loanTypeInput" required>
                        <option value="">Select Category...</option>
                        <option value="Personal Loan">Personal Loan</option>
                        <option value="Business Loan">Business Loan</option>
                        <option value="Educational Loan">Educational Loan</option>
                        <option value="Emergency Loan">Emergency Loan</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="amountInput">Loan Amount Requested</label>
                    <input type="text" id="amountInput" placeholder="e.g., ₱50,000" required>
                </div>

                <div class="form-group">
                    <label for="purposeInput">Funding Rationale / Purpose</label>
                    <input type="text" id="purposeInput" placeholder="e.g., Education / Business" required>
                </div>

                <div class="form-group">
                    <label for="termInput">Repayment Term</label>
                    <select id="termInput" required>
                        <option value="">Select Term...</option>
                        <option value="6 months">6 months</option>
                        <option value="12 months">12 months</option>
                        <option value="24 months">24 months</option>
                        <option value="36 months">36 months</option>
                    </select>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">Submit Application to Cloud</button>
        </form>

        <div id="submissionAlert" class="alert-box"></div>
    </div>
</div>

    <script>
    // 🟢 FIREBASE DATABASE INITIALIZATION
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
</script>

    <script>
    document.getElementById('rbeiForm').addEventListener('submit', function(e) {
        e.preventDefault(); // Prevents page refresh

        const submitBtn = document.getElementById('submitBtn');
        const alertBox = document.getElementById('submissionAlert');

        // Disable button while processing network submission
        submitBtn.disabled = true;
        submitBtn.innerText = "Transmitting Application...";
        alertBox.style.display = "none";

        // Generate Reference Code matching Admin Panel format
        const refCode = "RBEI-" + new Date().getFullYear() + "-" + Math.floor(100000 + Math.random() * 900000);

        // Gather all inputs from form fields
        const applicationData = {
            name: document.getElementById('fullNameInput').value.trim(),
            dob: document.getElementById('dobInput').value.trim(),
            phone: document.getElementById('phoneInput').value.trim(),
            email: document.getElementById('emailInput').value.trim(),
            addr: document.getElementById('addressInput').value.trim(),
            type: document.getElementById('loanTypeInput').value,
            amount: document.getElementById('amountInput').value.trim(),
            purpose: document.getElementById('purposeInput').value.trim(),
            term: document.getElementById('termInput').value,
            status: "Under Review",
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        };

        // 🟢 SAVE DIRECTLY TO FIRESTORE COLLECTION "rbei_applications"
        db.collection("rbei_applications").doc(refCode).set(applicationData)
        .then(() => {
            alertBox.style.display = "block";
            alertBox.style.backgroundColor = "#d1fae5";
            alertBox.style.color = "#16a34a";
            alertBox.innerHTML = `✅ Application transmitted successfully!<br>Tracking Reference Code: <strong>${refCode}</strong>`;

            submitBtn.disabled = false;
            submitBtn.innerText = "Submit Application to Cloud";
            document.getElementById('rbeiForm').reset();
        })
        .catch((error) => {
            console.error("Firestore Upload Error: ", error);
            alertBox.style.display = "block";
            alertBox.style.backgroundColor = "#fee2e2";
            alertBox.style.color = "#dc2626";
            alertBox.innerText = "❌ Submission failed: " + error.message;

            submitBtn.disabled = false;
            submitBtn.innerText = "Submit Application to Cloud";
        });
    });
</script>

</body>
</html>
</nav>
