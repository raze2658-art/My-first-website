<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Videos for Langga 🎬</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.8;
            margin: 0;
            padding: 0;
            background-color: #fff0f5;
            color: #4a3b32;
        }
        header {
            background: linear-gradient(135deg, #ffb6c1, #ff69b4);
            color: white;
            padding: 2.5rem 2rem;
            text-align: center;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.3);
        }
        header h1 {
            font-size: 2.3rem;
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }
        main {
            max-width: 800px;
            margin: 3rem auto;
            padding: 0 1.5rem;
            text-align: center;
        }
        .video-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }
        @media (max-width: 768px) {
            .video-grid {
                grid-template-columns: 1fr;
            }
        }
        .card {
            background: white;
            padding: 3rem 2rem;
            border-radius: 20px;
            box-shadow: 0 12px 30px rgba(255, 182, 193, 0.4);
            border: 1px solid #ffe4e1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card h2 {
            color: #ff1493;
            margin-top: 0;
            font-size: 1.5rem;
        }
        .video-icon {
            font-size: 4.5rem;
            margin: 1.5rem 0;
            animation: pulse 2s infinite;
        }
        p {
            font-size: 1.05rem;
            color: #666;
            margin-bottom: 1.5rem;
        }
        .play-link {
            background: linear-gradient(135deg, #ff69b4, #ff1493);
            color: white;
            text-decoration: none;
            padding: 0.9rem 2rem;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(255, 105, 180, 0.3);
            display: inline-block;
        }
        .play-link:hover {
            box-shadow: 0 6px 15px rgba(255, 20, 147, 0.5);
            transform: scale(1.05);
        }
        .back-btn {
            background-color: #4a3b32;
            color: white;
            text-decoration: none;
            padding: 0.8rem 2rem;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            display: inline-block;
            transition: all 0.3s ease;
            margin-top: 2rem;
        }
        .back-btn:hover {
            background-color: #2c221e;
        }
        footer {
            text-align: center;
            padding: 2.5rem;
            background-color: #ffb6c1;
            color: #7d4b57;
            font-weight: 600;
            font-size: 1rem;
            margin-top: 4rem;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <header>
        <h1>Our Moments Together 🎞️</h1>
    </header>

    <main>
        <div class="video-grid">
            
            <!-- CARD 1: YouTube Short -->
            <div class="card">
                <h2>Press Play, Langga! ❤️</h2>
                <div class="video-icon">📱❤️</div>
                <p>Click below to open and watch your first special video clip!</p>
                <a href="https://youtube.com" 
                   target="_blank" 
                   class="play-link">
                   ▶️ Watch Video 1
                </a>
            </div>

            <!-- CARD 2: Standard YouTube Video -->
            <div class="card">
                <h2>Part Two ✨</h2>
                <div class="video-icon">🍿🎬</div>
                <p>Click below to watch the second sweet birthday clip!</p>
                <a href="https://youtu.be" 
                   target="_blank" 
                   class="play-link">
                   ▶️ Watch Video 2
                </a>
            </div>

        </div>

        <!-- Back Button -->
        <a href="Happy Birthday.html" class="back-btn">⬅️ Go Back to Letter</a>
    </main>

    <footer>
        <p>Made with all my love for Langga ❤️ | September 2026</p>
    </footer>

</body>
</html>
