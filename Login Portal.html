<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Back - Secure Access</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* Left Branding Panel (Light Blue) */
        .left-panel {
            flex: 1;
            background-color: #f0f5fa;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
        }

        .logo-circle {
            width: 80px;
            height: 80px;
            background-color: #0b192c;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        /* Simple CSS representation of your shield/magnifying glass logo */
        .logo-icon {
            color: #ffffff;
            font-size: 32px;
            font-weight: bold;
        }

        .left-panel h1 {
            color: #0b192c;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .left-panel p {
            color: #8a9aa8;
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        /* Right Form Panel (Dark Navy) */
        .right-panel {
            flex: 1;
            background-color: #111823;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .form-container {
            width: 100%;
            max-width: 380px;
        }

        /* Role Switcher Tabs */
        .role-tabs {
            display: flex;
            background-color: #1e2633;
            padding: 4px;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: #8a9aa8;
            padding: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background-color: #1d72dd;
            color: #ffffff;
        }

        .right-panel h2 {
            color: #ffffff;
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .subtitle {
            color: #728095;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .input-wrapper {
            position: relative;
            margin-bottom: 16px;
        }

        /* Input field styles matched to your screenshot */
        .input-wrapper input {
            width: 100%;
            background-color: #eef2f7;
            border: none;
            border-radius: 8px;
            padding: 14px 14px 14px 40px;
            font-size: 15px;
            color: #333333;
            outline: none;
        }

        /* Placeholder styles icon hints */
        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #8a9aa8;
            font-size: 16px;
        }

        /* Login Button matched to your screenshot */
        .login-btn {
            width: 100%;
            background-color: #1d72dd;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s ease;
        }

        .login-btn:hover {
            background-color: #175cb4;
        }

        .footer-text {
            text-align: center;
            margin-top: 30px;
            color: #4f5e74;
            font-size: 12px;
        }

        /* Responsive design for smaller screens / mobile tablets */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }
            .left-panel {
                padding: 30px 20px;
                flex: 0 0 auto;
            }
            .right-panel {
                flex: 1;
            }
        }
    </style>
</head>
<body>

    <!-- Left side panel matching your mockup layout -->
    <div class="left-panel">
        <div class="logo-circle">
            <!-- Simulated shield logo character from image -->
            <span class="logo-icon">&#128737;</span> 
        </div>
        <h1 id="brandTitle">Credit Investigator</h1>
        <p id="brandTagline">Validate · Verify · Support Better Decisions</p>
    </div>

    <!-- Right side input panel matching your dark theme mockup -->
    <div class="right-panel">
        <div class="form-container">
            
            <!-- Custom Portal Selector Tabs -->
            <div class="role-tabs">
                <button class="tab-btn active" onclick="switchRole('investigator')">Investigator</button>
                <button class="tab-btn" onclick="switchRole('manager')">RBEI Manager</button>
            </div>

            <h2>Welcome Back</h2>
            <div class="subtitle">Please log in to continue</div>

            <form id="authForm" onsubmit="redirectUser(event)">
                <!-- User Input field -->
                <div class="input-wrapper">
                    <span class="input-icon">&#128100;</span>
                    <input type="text" id="username" placeholder="yohei" required>
                </div>

                <!-- Password Input field -->
                <div class="input-wrapper">
                    <span class="input-icon">&#128274;</span>
                    <input type="password" id="password" placeholder="······" required>
                </div>

                <button type="submit" class="login-btn">Login</button>
            </form>

            <div class="footer-text">
                Secure Access | <span id="systemFooterName">Credit Investigator System</span>
            </div>
        </div>
    </div>

    <script>
        // Track the current selection status
        let currentRole = 'investigator';

        function switchRole(role) {
            currentRole = role;
            
            // Get elements to change themes dynamically
            const buttons = document.querySelectorAll('.tab-btn');
            const brandTitle = document.getElementById('brandTitle');
            const brandTagline = document.getElementById('brandTagline');
            const systemFooterName = document.getElementById('systemFooterName');

            // Toggle active state visualization on buttons
            buttons.forEach(btn => btn.classList.remove('active'));
            
            if (role === 'investigator') {
                buttons[0].classList.add('active');
                brandTitle.innerText = "Credit Investigator";
                brandTagline.innerText = "Validate · Verify · Support Better Decisions";
                systemFooterName.innerText = "Credit Investigator System";
            } else {
                buttons[1].classList.add('active');
                brandTitle.innerText = "RBEI Manager";
                brandTagline.innerText = "Oversee · Authorize · Manage Operations";
                systemFooterName.innerText = "RBEI Manager Portal";
            }
        }

        function redirectUser(event) {
            event.preventDefault(); // Stop standard blank form reloading

            if (currentRole === 'manager') {
                // Route directly to your exact manager page file structure
                window.location.href = encodeURIComponent('RBEI Manager Portal.html');
            } else if (currentRole === 'investigator') {
                // Route directly to your exact credit investigator page file structure
                window.location.href = encodeURIComponent('Credit InvestigatorPortal.html');
            }
        }
    </script>
</body>
</html>
