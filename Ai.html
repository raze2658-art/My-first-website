<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Browser AI</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        textarea { width: 100%; height: 100px; margin-bottom: 10px; }
        button { background: #007BFF; color: white; border: none; padding: 10px 20px; cursor: pointer; }
        button:disabled { background: #cccccc; }
        #output { margin-top: 20px; padding: 15px; background: #f4f4f4; border-radius: 5px; white-space: pre-wrap; }
    </style>
</head>
<body>

    <h2>My Web AI Assistant</h2>
    <p>Type a prompt below and click "Ask AI".</p>
    
    <textarea id="prompt" placeholder="Type something here... (e.g., Write a poem about a robot)"></textarea>
    <br>
    <button id="submitBtn" onclick="askAI()">Ask AI</button>

    <h3>AI Response:</h3>
    <div id="output">Waiting for your input...</div>

    <script>
        async function askAI() {
            const promptInput = document.getElementById('prompt').value;
            const outputDiv = document.getElementById('output');
            const button = document.getElementById('submitBtn');

            if (!promptInput.trim()) {
                alert("Please enter a prompt first!");
                return;
            }

            // Update UI state
            outputDiv.innerText = "AI is thinking...";
            button.disabled = true;

            try {
                // We use an open-source model hosted for free public testing on Hugging Face
                const response = await fetch(
                    "https://huggingface.co",
                    {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ 
                            inputs: promptInput,
                            parameters: { max_new_tokens: 150 }
                        }),
                    }
                );

                const data = await response.json();
                
                // Display the generated text
                if (data && data[0] && data[0].generated_text) {
                    outputDiv.innerText = data[0].generated_text;
                } else {
                    outputDiv.innerText = "Error: Could not retrieve text from the AI model.";
                }

            } catch (error) {
                console.error(error);
                outputDiv.innerText = "An error occurred while connecting to the AI server.";
            } finally {
                button.disabled = false;
            }
        }
    </script>

</body>
</html>
